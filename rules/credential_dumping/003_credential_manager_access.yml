title: Windows Credential Manager Access Detection
id: c8d53e2f-7b9a-4c1d-8e6f-3a9c5d7e8b2f
status: stable
description: |
  Detects unauthorized access to Windows Credential Manager (Vault) which stores
  saved credentials for websites, applications, and network resources. Attackers
  frequently enumerate and export these credentials during post-exploitation.

  Detection focuses on vaultcmd.exe usage and direct vault file access patterns
  that are uncommon in normal user behavior.

  Maps to MITRE ATT&CK:
  - T1555.004 (Credentials from Password Stores: Windows Credential Manager)
  - T1003.001 (OS Credential Dumping: LSASS Memory)

references:
  - https://attack.mitre.org/techniques/T1555/004/
  - https://www.microsoft.com/en-us/security/blog/credential-theft/

author: SIEM Detection Engineering Portfolio
date: 2025/11/14
modified: 2025/11/14

logsource:
  category: process_creation
  product: windows

detection:
  selection_vaultcmd:
    Image|endswith: '\vaultcmd.exe'
    CommandLine|contains:
      - '/list'
      - '/listcreds'
      - '/listproperties'
      - '/listschema'

  selection_cmdkey:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains:
      - '/list'
      - '/generic'

  selection_powershell_vault:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'PasswordVault'
      - 'Get-StoredCredential'
      - 'Windows.Security.Credentials.PasswordVault'
      - 'VaultCmd'
      - '[Security.Credentials]'

  selection_file_access:
    TargetFilename|contains:
      - '\AppData\Local\Microsoft\Vault\'
      - '\AppData\Roaming\Microsoft\Vault\'
      - '\AppData\Local\Microsoft\Credentials\'
      - '\AppData\Roaming\Microsoft\Credentials\'
    TargetFilename|endswith:
      - '.vcrd'
      - '.crd'

  # Suspicious parent processes
  selection_suspicious_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
    Image|endswith:
      - '\vaultcmd.exe'
      - '\cmdkey.exe'

  filter_legitimate:
    User|contains:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'
    ParentImage|contains:
      - 'C:\Windows\System32\svchost.exe'
      - 'C:\Windows\System32\services.exe'

  filter_browser_legitimate:
    Image|contains:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
      - '\iexplore.exe'

  condition: (selection_vaultcmd or selection_cmdkey or selection_powershell_vault or selection_file_access or selection_suspicious_parent) and not filter_legitimate and not filter_browser_legitimate

falsepositives:
  - Legitimate user credential management
  - Browser password managers
  - System administrators managing saved credentials
  - Software installation processes

level: high

tags:
  - attack.credential_access
  - attack.t1555.004
  - attack.t1003.001
  - detection.endpoint
  - detection.threat_hunting

fields:
  - Image
  - CommandLine
  - User
  - ParentImage
  - ParentCommandLine
  - TargetFilename
  - WorkingDirectory
